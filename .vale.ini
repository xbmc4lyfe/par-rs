StylesPath = .vale/styles
MinAlertLevel = warning
Packages = https://github.com/vale-cli/Google/releases/download/v0.7.1/Google.zip

[formats]
rs = md
py = md

[*.{md,rs,py,sh}]
BasedOnStyles = Google

[*.rs]
View = Rust
TokenIgnores = <[^>]+>, \{[^}]*\}

[*.py]
View = Python

[*.sh]
View = Shell

[justfile]
BasedOnStyles = Google
View = Shell
